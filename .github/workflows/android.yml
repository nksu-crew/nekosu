name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "manager/app/src/**/*.kt"
      - "manager/build.gradle.kts"
      - "manager/gradle/libs.versions.toml"
      - "manager/app/src/**/*.c"
      - "userspace/init/**"
      - "userspace/ncore/**/**/*.rs"
  pull_request:
    branches: [ "main" ]
    paths:
      - "manager/app/src/**/*.kt"
      - "manager/build.gradle.kts"
      - "manager/gradle/libs.versions.toml"
      - "manager/app/src/**/*.c"
      - "userspace/init/**"
      - "userspace/ncore/**/**/*.rs"

jobs:
  build-lkm:
    uses: ./.github/workflows/build-lkm.yml

  build:
    needs: build-lkm
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle
        
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: |
          aarch64-linux-android
          x86_64-linux-android

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2

    - name: Download LKM artifacts
      uses: actions/download-artifact@v7
      with:
        path: lkm-artifacts

    - name: Prepare KOs
      run: |
        mkdir -p userspace/init/ko
        find lkm-artifacts -name '*_nksu.ko' -exec cp {} userspace/init/ko/ \;
        ls -la userspace/init/ko/

    - name: Build Rust CLI (cross-compile manually)
      env:
        API_LEVEL: 29
      run: |
        NDK_TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
        NDK_SYSROOT="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
        echo "$NDK_TOOLCHAIN" >> "$GITHUB_PATH"

        # aarch64
        export CC_aarch64_linux_android="${NDK_TOOLCHAIN}/aarch64-linux-android${API_LEVEL}-clang"
        export CXX_aarch64_linux_android="${NDK_TOOLCHAIN}/aarch64-linux-android${API_LEVEL}-clang++"
        export AR_aarch64_linux_android="${NDK_TOOLCHAIN}/llvm-ar"
        export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${CC_aarch64_linux_android}"
        export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=${NDK_SYSROOT} --target=aarch64-linux-android${API_LEVEL}"

        # x86_64
        export CC_x86_64_linux_android="${NDK_TOOLCHAIN}/x86_64-linux-android${API_LEVEL}-clang"
        export CXX_x86_64_linux_android="${NDK_TOOLCHAIN}/x86_64-linux-android${API_LEVEL}-clang++"
        export AR_x86_64_linux_android="${NDK_TOOLCHAIN}/llvm-ar"
        export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="${CC_x86_64_linux_android}"
        export BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--sysroot=${NDK_SYSROOT} --target=x86_64-linux-android${API_LEVEL}"

        cargo build --release --target aarch64-linux-android
        cargo build --release --target x86_64-linux-android

        mkdir -p manager/app/src/main/jniLibs/arm64-v8a
        mkdir -p manager/app/src/main/jniLibs/x86_64
        cp target/aarch64-linux-android/release/ncore manager/app/src/main/jniLibs/arm64-v8a/libncore.so
        cp target/x86_64-linux-android/release/ncore manager/app/src/main/jniLibs/x86_64/libncore.so

    - name: Build init (arm64-v8a)
      env:
        API_LEVEL: 29
      run: |
        NDK_TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
        cmake -S userspace/init -B build/init-arm64-v8a \
          -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-${API_LEVEL} \
          -DLLVM_OBJCOPY=${NDK_TOOLCHAIN}/llvm-objcopy \
          -DKO_ELF_FORMAT=elf64-littleaarch64 \
          -DKO_ELF_ARCH=aarch64
        cmake --build build/init-arm64-v8a
        cp build/init-arm64-v8a/init manager/app/src/main/jniLibs/arm64-v8a/libinit.so
        file manager/app/src/main/jniLibs/arm64-v8a/libinit.so

    - name: Build init (x86_64)
      env:
        API_LEVEL: 29
      run: |
        NDK_TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
        cmake -S userspace/init -B build/init-x86_64 \
          -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=x86_64 \
          -DANDROID_PLATFORM=android-${API_LEVEL} \
          -DLLVM_OBJCOPY=${NDK_TOOLCHAIN}/llvm-objcopy \
          -DKO_ELF_FORMAT=elf64-x86-64 \
          -DKO_ELF_ARCH=i386:x86-64
        cmake --build build/init-x86_64
        cp build/init-x86_64/init manager/app/src/main/jniLibs/x86_64/libinit.so
        file manager/app/src/main/jniLibs/x86_64/libinit.so

    - name: Decode Release Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > manager/release.keystore

    - name: Build with Gradle
      working-directory: manager
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v7
      with:
        name: release
        path: manager/app/build/outputs/apk/release/*.apk
